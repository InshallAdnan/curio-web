<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Library · Curio</title>
<script>(function(){var t=new URLSearchParams(location.search).get('theme');try{t=t||localStorage.getItem('curio-theme')||'system'}catch(e){}if(t==='system')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t})()</script>
<link rel="stylesheet" href="library.css">
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>
<script src="library.js"></script>
</body>
</html>
