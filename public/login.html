<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Curio</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<script>try{var t=localStorage.getItem('curio-theme')||'system';if(t==='system')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="/app.css">
<style>
body{display:grid;place-items:center;min-height:100vh;padding:20px}
.box{width:min(400px,100%);text-align:center}
.box .logo{width:58px;height:58px;border-radius:17px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:28px;margin:0 auto 18px;box-shadow:0 12px 30px color-mix(in srgb,var(--accent) 35%,transparent)}
h1{font-size:26px;margin:0 0 6px;letter-spacing:-.02em}
.g{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;text-decoration:none;margin-top:26px;box-shadow:var(--shadow)}
.g:hover{background:var(--hover)}
.msg{margin-top:16px;padding:12px 14px;border-radius:10px;background:color-mix(in srgb,var(--expense) 10%,transparent);color:var(--expense);text-align:left;display:none}
.msg.info{background:var(--card2);color:var(--muted)}
</style></head>
<body><div class="box card fade" style="padding:34px 28px">
<div class="logo">C</div><h1>Curio</h1><p class="muted">Your Pages and Finance, anywhere.</p>
<a class="g" id="go" href="/api/auth/login"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Continue with Google</a>
<div class="msg" id="msg"></div>
<p class="faint" style="margin-top:22px">Only the Google account set for this Curio can sign in.</p>
</div>
<script>
var q=new URLSearchParams(location.search),m=document.getElementById('msg');
if(q.get('e')){m.textContent=q.get('e');m.style.display='block'}
if(q.get('out')){m.textContent='You are signed out.';m.className='msg info';m.style.display='block'}
if(q.get('setup')){m.innerHTML='Sign-in is not set up yet. In Vercel › Settings › Environment Variables add <b>GOOGLE_CLIENT_ID</b>, <b>GOOGLE_CLIENT_SECRET</b> and <b>ALLOWED_EMAIL</b>, then redeploy.';m.className='msg info';m.style.display='block'}
</script>
</body></html>
